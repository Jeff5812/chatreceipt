# Labelled conversations for evaluating the transaction intelligence engine.
#
# These conversations are synthetic: written and labelled by hand for this evaluation, not taken from real
# customers. Labels state what a careful person would record, following the rules in CLAUDE.md §5.
#
# expect keys (all optional, and only the keys present are scored):
#   contains_transaction  false when the chat holds no transaction (default true)
#   currency, seller, buyer
#   items        [[word in the description, quantity, unit price], ...]; null means it must be left empty
#   delivery     the delivery fee; null means none may be recorded
#   discount     total discount; fees: total additional fees
#   total        the backend's calculated total; null means it can't be calculated
#   payment      not_specified | unpaid | partially_paid | paid | refunded
#   paid         the amount paid
#   agreement    enquiry | quotation | negotiation | agreement_reached | agreement_unclear | cancelled | completed
#   review       true when a person must act before approval; false when the record is clean
#   deals        the expected transactions, when a chat holds more than one
#
# The split into development and held-out test cases is fixed by position in each category (see dataset.py).

simple_purchase:
